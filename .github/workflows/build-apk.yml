name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment file (.env)
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            fi
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify APK Generated
        run: |
          ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "JARVIS AI Assistant - Latest Build"
          body: |
            ### J.A.R.V.I.S. AI Assistant — Automated Debug APK Release
            
            This APK is automatically compiled and published via GitHub Actions.
            
            - **Download Link**: [`app-debug.apk`](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)
            - **Target File**: `app-debug.apk`
            - **Build**: Debug Build with Full Offline Simulator + Native Gemini Core
          draft: false
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
